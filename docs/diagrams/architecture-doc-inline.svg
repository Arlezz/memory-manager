<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="memory-manager-doc-inline-title memory-manager-doc-inline-desc">
      <title id="memory-manager-doc-inline-title">How memory-manager keys memory by git remote</title>
      <desc id="memory-manager-doc-inline-desc">Architecture diagram: project memory committed in the work repo and personal memory in a private repo are merged into the directory Claude Code reads, keyed by the normalized git remote rather than the filesystem path, and what the session writes is routed back to each layer by memory type.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1d4ed8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f9fa"/>

