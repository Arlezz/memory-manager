="12" rx="2" fill="none" stroke="#64748b" stroke-opacity="0.40" stroke-width="0.8"/><text x="67" y="345" fill="#64748b" fill-opacity="0.85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LAYER</text><text x="140" y="364" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Personal memory</text><text x="140" y="378" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">private repo</text><text x="140" y="392" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">global/  projects/&lt;slug&gt;/</text><rect x="344" y="88" width="248" height="328" rx="6" fill="#f7f9fa"/><rect x="344" y="88" width="248" height="328" rx="6" fill="rgba(15,118,110,0.10)" stroke="#0f766e" stroke-width="1"/><rect x="352" y="96" width="44" height="12" rx="2" fill="none" stroke="#0f766e" stroke-opacity="0.40" stroke-width="0.8"/><text x="374" y="105" fill="#0f766e" fill-opacity="0.85" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MERGED</text><text x="468" y="170" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code memory directory</text><text x="468" y="184" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.claude/projects/&lt;mangled&gt;/memory/</text><text x="468" y="293" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">MEMORY.md regenerated from frontmatter</text><text x="468" y="307" fill="#64748b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">manifest: layer, origin, content hash</text><rect x="696" y="216" width="200" height="80" rx="6" fill="#f7f9fa"/><rect x="696" y="216" width="200" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/><rect x="704" y="224" width="38" height="12" rx="2" 