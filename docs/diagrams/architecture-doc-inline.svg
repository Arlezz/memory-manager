"592" y2="272" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="621" y="252" width="46" height="12" rx="2" fill="#f7f9fa"/><text x="644" y="260" fill="#64748b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITES</text>

