name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # All three targets, because this tool is mostly path handling and git
    # invocation — exactly what differs between Windows and POSIX.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      # Several tests drive the real git binary. It is present on all three
      # runners; this makes the dependency visible if that ever changes.
      - name: Show git version
        run: git --version

      - name: Check formatting
        # gofmt -l prints files that need formatting, so any output is a failure.
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "these files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi
        shell: bash

      - run: go vet ./...

      - run: go test -race -cover ./...

      - name: Build
        run: go build ./cmd/memory-manager

  vuln:
    # One runner is enough: govulncheck reads the module and the vulnerability
    # database, and neither answer differs by operating system. It is its own
    # job so that an advisory published between two pushes reports as itself
    # rather than as a failure of the test matrix.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.8"

      # The tool is pinned so a release of govulncheck cannot fail this build on
      # its own. What it knows is not pinned: the vulnerability database is
      # fetched at run time, so a new advisory still surfaces here.
      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
